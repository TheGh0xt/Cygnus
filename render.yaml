# Render blueprint for Cygnus (PMIE Layers 3, 4 and 5).
#
# Connect this repo in Render's dashboard and it reads this file.
#
# ---------------------------------------------------------------------------
# MEMORY STORE: Postgres (Supabase) in production, enforced.
#
# PMIE_ENVIRONMENT=production below (B.13) makes build_memory_store() refuse
# the SQLite fallback outright: a missing or unreachable Postgres store fails
# startup instead of silently writing to this container's ephemeral disk. The
# memory store holds every completed report with the price observed at the
# time, which cannot be reconstructed later — it is what the evaluation
# worker scores 48 hours on, so losing it means no accuracy record.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: cygnus
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: PORT
        value: 8000

      # B.13: the explicit production signal. Not a secret — the deploy
      # config itself declares this service production, so PMIE_ENVIRONMENT
      # can't be left unset by omission the way a dashboard-only value could.
      - key: PMIE_ENVIRONMENT
        value: production

      # Where Sagittarius is reachable. Point this at the deployed Layer 1
      # service, not localhost.
      - key: SAGITTARIUS_MCP_URL
        sync: false

      # The ADK's MCP connect timeout defaults to 5 seconds. Sagittarius
      # sleeps when idle on a free plan and takes ~50s to wake, so at the
      # default every market-data stage fails and the analyst produces a
      # confident report built only from news.
      - key: SAGITTARIUS_TIMEOUT_SECONDS
        value: "90"

      # Secrets: set these in Render's dashboard, never in this file.
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Either name works. Supabase's connect panel calls it
      # SUPABASE_SECRET_KEY, so that block can be pasted straight in.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Shared secret for the scheduled evaluation trigger. Without it the
      # endpoint stays closed, so nothing ever scores a report and the
      # accuracy record never starts.
      - key: PMIE_CRON_SECRET
        sync: false

      # PMIE_AUTH_DISABLED is deliberately absent. Authentication is on unless
      # explicitly switched off, and a deployed instance must never have it
      # off: an unauthenticated public endpoint would let anyone spend the
      # project's Gemini quota.
    autoDeploy: true
